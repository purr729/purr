name: Deploy NEON DRIFT to GitHub Pages

on:
  push:
    branches:
      - neon-drift-html-game
    paths:
      - 'neon-drift/**'
      - '.github/workflows/deploy-neon-drift.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neon-drift-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./neon-drift

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
